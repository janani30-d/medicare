<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Pharmacy | Trusted Healthcare Store</title>

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- ================= AUTH CONTROLS ================= -->

<div class="auth-controls">

    <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle dark mode"
        type="button"
    >
        <i class="fa-solid fa-moon"></i>
    </button>

    <button
        class="rtl-toggle"
        id="rtlToggle"
        aria-label="Toggle RTL"
        type="button"
    >
        <i class="fa-solid fa-right-left"></i>
    </button>

</div>
<!-- =========================================================
     REGISTER PAGE
     PART 1 - LOGO + REGISTER FORM + SOCIAL LOGIN
========================================================= -->

<main class="register-page">

    <section class="register-section">

        <div class="register-card">


            <!-- =================================================
                 LOGO INSIDE CONTAINER
            ================================================== -->

            <div class="register-logo">

                <a
                    href="index.html"
                    class="register-logo-link"
                >

                    <img
                        src="images/logo.png"
                        alt="MediCare Logo"
                        class="register-logo-image"
                    >

                </a>

            </div>


            <!-- =================================================
                 REGISTER HEADING
            ================================================== -->

            <div class="register-heading">

                <span class="register-subtitle">
                    JOIN US
                </span>

                <h1>
                    Create Account
                </h1>

                <p>
                    Create your account to get started.
                </p>

            </div>


            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form
                class="register-form"
                id="register-form"
                action="#"
                method="post"
            >


                <!-- =================================================
                     FULL NAME
                ================================================== -->

                <div class="register-form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- =================================================
                     EMAIL
                ================================================== -->

                <div class="register-form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- =================================================
                     PHONE
                ================================================== -->

                <div class="register-form-group">

                    <label for="register-phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="register-phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                    >

                </div>


                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="register-form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="register-password-wrapper">

                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="register-password-toggle"
                            data-target="register-password"
                            aria-label="Show password"
                        >

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     CONFIRM PASSWORD
                ================================================== -->

                <div class="register-form-group">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>

                    <div class="register-password-wrapper">

                        <input
                            type="password"
                            id="register-confirm-password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="register-password-toggle"
                            data-target="register-confirm-password"
                            aria-label="Show password"
                        >

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     TERMS
                ================================================== -->

                <label class="register-terms">

                    <input
                        type="checkbox"
                        id="register-terms"
                        name="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="terms.html">
                            Terms & Conditions
                        </a>
                        and
                        <a href="privacy.html">
                            Privacy Policy
                        </a>
                    </span>

                </label>


                <!-- =================================================
                     CREATE ACCOUNT
                ================================================== -->

                <button
                    type="submit"
                    class="register-submit"
                >
                    Create Account
                </button>


                <!-- =================================================
                     OR DIVIDER
                ================================================== -->

                <div class="register-divider">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- =================================================
                     SOCIAL REGISTER
                ================================================== -->

                <div class="register-social-login">


                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="register-social-btn google-register"
                        aria-label="Continue with Google"
                    >

                        <svg
                            class="register-google-icon"
                            viewBox="0 0 48 48"
                            aria-hidden="true"
                        >

                            <path
                                fill="#FFC107"
                                d="M43.6 20.5H42V20H24v8h11.3
                                C33.6 32.7 29.2 36 24 36
                                c-6.6 0-12-5.4-12-12s5.4-12
                                12-12c3.1 0 5.9 1.2 8 3.1
                                l5.7-5.7C34.2 6.1 29.4 4
                                24 4 12.9 4 4 12.9 4 24
                                s8.9 20 20 20 20-8.9 20-20
                                c0-1.3-.1-2.3-.4-3.5z"
                            />

                            <path
                                fill="#FF3D00"
                                d="M6.3 14.7l6.6 4.8
                                C14.7 16 18.9 12 24 12
                                c3.1 0 5.9 1.2 8 3.1
                                l5.7-5.7C34.2 6.1 29.4 4
                                24 4 16.3 4 9.7 8.3
                                6.3 14.7z"
                            />

                            <path
                                fill="#4CAF50"
                                d="M24 44c5.3 0 10-2 13.3-5.2
                                l-6.1-5.2C29.5 35.1 26.9 36
                                24 36c-5.2 0-9.6-3.3-11.3-8
                                l-6.5 5C9.6 39.4 16.2 44
                                24 44z"
                            />

                            <path
                                fill="#1976D2"
                                d="M43.6 20.5H42V20H24v8h11.3
                                c-1.1 3.1-3.5 5.5-6.1 7.1
                                l6.1 5.2C39.3 36.9 44 31.1
                                44 24c0-1.3-.1-2.3-.4-3.5z"
                            />

                        </svg>

                        <span>
                            Continue with Google
                        </span>

                    </button>


                    <!-- FACEBOOK -->

                    <button
                        type="button"
                        class="register-social-btn facebook-register"
                        aria-label="Continue with Facebook"
                    >

                        <i class="fab fa-facebook-f"></i>

                        <span>
                            Continue with Facebook
                        </span>

                    </button>


                    <!-- APPLE -->

                    <button
                        type="button"
                        class="register-social-btn apple-register"
                        aria-label="Continue with Apple"
                    >

                        <i class="fab fa-apple"></i>

                        <span>
                            Continue with Apple
                        </span>

                    </button>

                </div>


                <!-- =================================================
                     LOGIN LINK
                ================================================== -->

                <div class="register-login">

                    <p>
                        Already have an account?

                        <a href="login.html">
                            Sign In
                        </a>
                    </p>

                </div>

            </form>

        </div>

    </section>

</main>


<!-- JS -->

  <script src="js/script.js"></script>

</body>
</html>

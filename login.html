<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Pharmacy | Trusted Healthcare Store</title>

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- ================= AUTH CONTROLS ================= -->

<div class="auth-controls">

    <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle dark mode"
        type="button"
    >
        <i class="fa-solid fa-moon"></i>
    </button>

    <button
        class="rtl-toggle"
        id="rtlToggle"
        aria-label="Toggle RTL"
        type="button"
    >
        <i class="fa-solid fa-right-left"></i>
    </button>

</div>
<!-- =========================================================
     LOGIN PAGE
     PART 1 - LOGIN CONTAINER + LOGO + FORM + SOCIAL LOGIN
========================================================= -->

<main class="login-page">

    <section class="login-section">

        <div class="login-card">


            <!-- =================================================
                 LOGO INSIDE LOGIN CONTAINER
            ================================================== -->

            <div class="login-logo">

                <a
                    href="index.html"
                    class="login-logo-link"
                >

                    <img
                        src="images/logo.png"
                        alt="MediCare Logo"
                        class="login-logo-image"
                    >

                </a>

            </div>


            <!-- =================================================
                 LOGIN HEADING
            ================================================== -->

            <div class="login-heading">

                <span class="login-subtitle">
                    WELCOME BACK
                </span>

                <h1>
                    Sign In
                </h1>

                <p>
                    Sign in to your account to continue.
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                class="login-form"
                id="login-form"
                action="#"
                method="post"
            >


                <!-- EMAIL -->

                <div class="login-form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="login-form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                        >

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     REMEMBER + FORGOT
                ================================================== -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember-me"
                            name="remember"
                        >

                        <span>
                            Remember Me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- =================================================
                     SIGN IN
                ================================================== -->

                <button
                    type="submit"
                    class="login-submit"
                >
                    Sign In
                </button>


                <!-- =================================================
                     OR DIVIDER
                ================================================== -->

                <div class="login-divider">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- =================================================
                     SOCIAL LOGIN
                ================================================== -->

                <div class="social-login">


                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="social-login-btn google-login"
                        aria-label="Continue with Google"
                    >

                        <!-- Original Google G SVG -->

                        <svg
                            class="google-icon"
                            viewBox="0 0 48 48"
                            aria-hidden="true"
                        >

                            <path
                                fill="#FFC107"
                                d="M43.6 20.5H42V20H24v8h11.3
                                C33.6 32.7 29.2 36 24 36
                                c-6.6 0-12-5.4-12-12s5.4-12
                                12-12c3.1 0 5.9 1.2 8 3.1
                                l5.7-5.7C34.2 6.1 29.4 4
                                24 4 12.9 4 4 12.9 4 24
                                s8.9 20 20 20 20-8.9 20-20
                                c0-1.3-.1-2.3-.4-3.5z"
                            />

                            <path
                                fill="#FF3D00"
                                d="M6.3 14.7l6.6 4.8
                                C14.7 16 18.9 12 24 12
                                c3.1 0 5.9 1.2 8 3.1
                                l5.7-5.7C34.2 6.1 29.4 4
                                24 4 16.3 4 9.7 8.3
                                6.3 14.7z"
                            />

                            <path
                                fill="#4CAF50"
                                d="M24 44c5.3 0 10-2 13.3-5.2
                                l-6.1-5.2C29.5 35.1 26.9 36
                                24 36c-5.2 0-9.6-3.3-11.3-8
                                l-6.5 5C9.6 39.4 16.2 44
                                24 44z"
                            />

                            <path
                                fill="#1976D2"
                                d="M43.6 20.5H42V20H24v8h11.3
                                c-1.1 3.1-3.5 5.5-6.1 7.1
                                l6.1 5.2C39.3 36.9 44 31.1
                                44 24c0-1.3-.1-2.3-.4-3.5z"
                            />

                        </svg>

                        <span>
                            Continue with Google
                        </span>

                    </button>


                    <!-- FACEBOOK -->

                    <button
                        type="button"
                        class="social-login-btn facebook-login"
                        aria-label="Continue with Facebook"
                    >

                        <i class="fab fa-facebook-f"></i>

                        <span>
                            Continue with Facebook
                        </span>

                    </button>


                    <!-- APPLE -->

                    <button
                        type="button"
                        class="social-login-btn apple-login"
                        aria-label="Continue with Apple"
                    >

                        <i class="fab fa-apple"></i>

                        <span>
                            Continue with Apple
                        </span>

                    </button>

                </div>


                <!-- =================================================
                     REGISTER
                ================================================== -->

                <div class="login-register">

                    <p>
                        Don't have an account?

                        <a href="register.html">
                            Register
                        </a>
                    </p>

                </div>

            </form>

        </div>

    </section>

</main>


<!-- JS -->

  <script src="js/script.js"></script>

</body>
</html>
